[project]
name = "company-scraper"
version = "0.1.0"
description = "AI-powered company intelligence scraper using Gemini 2.0 Flash"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "google-genai>=0.7.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.3",
    "rapidfuzz>=3.9.0",
    "lxml>=5.2.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
