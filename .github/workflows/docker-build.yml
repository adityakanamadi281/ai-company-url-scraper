name: Verify Production Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: company-scraper:latest

    - name: Run Docker Container (Sanity Check)
      run: |
        docker run -d -p 8000:8000 --name scraper_app company-scraper:latest
        sleep 5
        docker ps
        curl -f http://localhost:8000 || exit 1
        docker stop scraper_app
